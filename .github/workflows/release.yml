name: Release

# Push a tag like v0.1.0. Publishes to TestPyPI, then waits for approval on the
# "pypi" environment (run notebooks/smoke_test.ipynb in Colab first), then PyPI.
#
# One-time setup:
#   1. On pypi.org and test.pypi.org, add a Trusted Publisher for this repo,
#      workflow "release.yml", environments "pypi" and "testpypi".
#   2. In GitHub Settings > Environments, create "testpypi" and "pypi";
#      add yourself as a required reviewer on "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  # Reuse the CI run from pushing this commit to main (the Colab image job takes
  # ~6 min). Waits for it if still running; runs the full CI only if there is none.
  ci-status:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          id=$(gh run list -R "$REPO" --workflow ci.yml --commit "$SHA" --event push \
            --json databaseId,status,conclusion \
            --jq '[.[] | select(.status != "completed" or .conclusion == "success")][0].databaseId // empty')
          if [ -n "$id" ] && gh run watch "$id" -R "$REPO" --exit-status > /dev/null; then
            echo "Reusing CI run $id for $SHA"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No passing CI run for $SHA; running CI"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: ci-status
    if: needs.ci-status.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && (needs.ci-status.outputs.passed == 'true' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Version matches tag
        run: |
          ls dist
          test -f "dist/colabutilscs4337-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Optional: if TestPyPI has no trusted publisher, this fails and PyPI still runs.
  publish-testpypi:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/colabutilscs4337
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, publish-testpypi]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/colabutilscs4337
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

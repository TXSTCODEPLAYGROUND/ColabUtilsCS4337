name: Release

# Push a tag like v0.1.0. Publishes to TestPyPI, then waits for approval on the
# "pypi" environment (run notebooks/smoke_test.ipynb in Colab first), then PyPI.
#
# One-time setup:
#   1. On pypi.org and test.pypi.org, add a Trusted Publisher for this repo,
#      workflow "release.yml", environments "pypi" and "testpypi".
#   2. In GitHub Settings > Environments, create "testpypi" and "pypi";
#      add yourself as a required reviewer on "pypi".
on:
  push:
    tags: ["v*"]

jobs:
  # Reuse the CI run from pushing this commit to main (the Colab image job takes
  # ~6 min): wait for it if still running, stop if it failed, and run the full CI
  # only if this commit was never pushed to main.
  ci-status:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      result: ${{ steps.find.outputs.result }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          id=$(gh run list -R "$REPO" --workflow ci.yml --commit "$SHA" --event push \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$id" ]; then
            echo "No CI run for $SHA on main; running CI"
            echo "result=none" >> "$GITHUB_OUTPUT"
          elif gh run watch "$id" -R "$REPO" --exit-status > /dev/null; then
            echo "Reusing passing CI run $id for $SHA"
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "::error::CI run $id failed for $SHA: https://github.com/$REPO/actions/runs/$id"
            exit 1
          fi

  ci:
    needs: ci-status
    if: needs.ci-status.outputs.result == 'none'
    uses: ./.github/workflows/ci.yml

  build:
    needs: [ci-status, ci]
    if: ${{ !cancelled() && needs.ci-status.result == 'success' && (needs.ci-status.outputs.result == 'passed' || needs.ci.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Version matches tag
        run: |
          ls dist
          test -f "dist/colabutilscs4337-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Optional: if TestPyPI has no trusted publisher, this fails and PyPI still runs.
  publish-testpypi:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/colabutilscs4337
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [build, publish-testpypi]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/colabutilscs4337
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  # Fast job: Colab's exact package versions (CPU wheels) on a stock runner.
  # 3.13 = current Colab runtime, 3.12 = pinned "2026.07" runtime.
  test-constraints:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with Colab constraints
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints/colab-gpu.txt \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            -e ".[all,dev]" torch torchvision fastai
      - run: python -c "import colabutilscs4337 as cu; cu.env.check()"
      - run: pytest -q
        env:
          MPLBACKEND: Agg

  # Real Colab environment: Google's published runtime image (CPU variant).
  test-colab-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COLAB_IMAGE: us-docker.pkg.dev/colab-images/public/cpu-runtime:latest
    steps:
      - name: Free disk space for the Colab image (~7 GB compressed)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache /usr/local/.ghcup /usr/share/swift
          docker system prune -af
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker pull "$COLAB_IMAGE"
      - name: Install and test inside the Colab image
        run: >
          docker run --rm --entrypoint bash -v "$PWD:/src" -w /src
          "$COLAB_IMAGE" scripts/ci_colab_image.sh
